function loaddan(dans){

gi("search").value="";
opendisk=true;
opendi();
    disks=[];ndans=[];cards=[];
    for (let t of dans){
        ndans.push(trans(t));
        if (dandisks[t]){
            for (let i of dandisks[t]){
                disks.push(i);
            }
        }else{
            fetchdan(t);
        }
        if (dancards[t]){
         
          for (let i of dancards[t]){
                cards.push(i);
            }
        }else{
            fetchcards(t);
        }
        ndan=Number(t);
    }
    
    loaddisk(disks);
    gi('danhead').innerText=`第${ndans.join("、")}彈`;
}
function fetchdan(dan){
fetch('/api/v1/getdesk',
{
headers: {
  'Accept': 'application/json',
  'Content-Type': 'application/json'
},
method: "POST",
body: JSON.stringify({t:dan})
}).then(function (re) {return re.json();}).then(function(d){
    d=d.disk;
    dandisks[dan]=d;
    for (let t of d){
    disks.push(t);}
    loaddisk(disks);
}).catch(function(e) {
});
}

function fetchcards(dan){
fetch(`/dans/d${dan}.json`).then(re=> re.json()).then(function(d){
    d=d.disk;
    dancards[dan]=d;
    for (let t of d){
    cards.push(t);}
    loaddisk(disks);
}).catch(function(e) {
});
}

function loaddisk(disk){
    nowdisks=disk;
    gi("disklist").innerHTML=disk.length>0 ?``:"正在載入";
    
    let co=1;
    for (let i of disk){
      let ol=cdom("div",0,0,0,`<p>第${co}條</p>`);
      co++;
      let hast=false;
      for (let d of i){
        hast=hast || (d.n.indexOf(gi("search").value)!==-1);
        let li=cdom("div");
        t=loadimg?`<img src="${d.c.startsWith("https")?d.c:`https://webassets-pokemonmezastar.marv.jp/assets/img/ver1/pm_en_${d.c}_f.png`}" alt="${d.n}-未提供圖片" title="${d.n}" >`:''
        li.innerHTML=`${t}<h3><weak>${d.c?(d.c.startsWith("http")?"":d.c):""}</weak> ${d.n}</h3>`;
        li.addEventListener("click",()=>{
    playCry(d.s);
    css(li,{boxShadow:"1px 1px 1vh 1vh #2222",transform:"scale(1.1) rotateZ(5deg)"});
    setTimeout(()=>{css(li,{boxShadow:"",transform:""});
     },1000);
   });
        ol.appendChild(li);
      }
      if (hast){
      gi("disklist").appendChild(ol);
      }
    }
    
  co=1;
  gi("cardslist").innerHTML=``;
  for (let i of cards){
   let card=cdom("div",0,0,0,`<img src="${i.c}" alt="${i.n}-卡匣圖片" title="${i.n}" ><p><weak>${ndan}-${co}</weak></p><p><strong>${i.n}</strong></p>`);
   card.addEventListener("click",()=>{
    gi("infosearch").value=i.n;
    playCry(i.s);
    css(card,{boxShadow:"1px 1px 1vh 1vh #2222",transform:"scale(1.1) rotateZ(5deg)"});
    cards.className="shake";
    setTimeout(()=>{css(card,{boxShadow:"",transform:""});
     cards.className="";
     },1000);
   });
   co++
   let hast=(i.n.indexOf(gi("search").value)!==-1);
   if (hast){
      gi("cardslist").appendChild(card);
   }
  }
}
