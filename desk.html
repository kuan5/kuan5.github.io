function trans(t) {
    for (let i in trule){
        t=t.replace(i,trule[i]);
    }
    return t;
}
function loaddan(dans){
    disks=[];let ndans=[];
    for (let t of dans){
        ndans.push(trans(t));
        if (dandisks[t]){
            for (let i of dandisks[t]){
                disks.push(i);
            }
        }else{
            fetchdan(t);
        }
    }
    loaddisk(disks);
    gi('danhead').innerText=`第${ndans.join("、")}彈`;
}
function fetchdan(dan){
fetch('/api/v1/getdesk',
{
headers: {
  'Accept': 'application/json',
  'Content-Type': 'application/json'
},
method: "POST",
body: JSON.stringify({t:dan})
}).then(function (re) {return re.json();}).then(function(d){
    d=d.disk;
    dandisks[dan]=d;
    for (let t of d){
    disks.push(t);}
    loaddisk(disks);
}).catch(function(e) {
});
}
function loaddisk(disk){
    nowdisks=disk;
    gi("disklist").innerHTML=disk.length>0 ?"":"正在載入";
    let co=1;
    for (let i of disk){
      let ol=cdom("ol",0,0,0,`<p>第${co}條</p>`);
      co++;
      for (let d of i){
        let li=cdom("li");
        t=loadimg?`<img src="${d.c.startsWith("https")?d.c:`https://webassets-pokemonmezastar.marv.jp/assets/img/ver1/pm_en_${d.c}_f.png`}" alt="${d.n}-未提供圖片" title="${d.n}" >`:''
        li.innerHTML=`${t}<h3><weak>${d.c?(d.c.startsWith("http")?"":d.c):""}</weak> ${d.n}</h3>${d.s?`<audio src="/sd/${d.s}.mp3" preload="auto" controls="auto"></audio>`:""}`;
        ol.appendChild(li);
      }
      gi("disklist").appendChild(ol);
    }
}
